{% extends 'layout.html' %}
{% block content %}
<div class="page-grid">
  <div class="card">
    <h3>Observability monitor</h3>
    <div id="health-panel">Collecting service health data...</div>
  </div>
  <div class="card chart-card">
    <h3>API status metrics</h3>
    <canvas id="health-chart"></canvas>
  </div>
  <div class="card">
    <h3>System health</h3>
    <ul id="health-list"></ul>
  </div>
  <div class="card">
    <h3>Prediction logs</h3>
    <div id="log-stream" class="log-panel">Live logs will appear once models are trained and predictions run.</div>
  </div>
</div>
{% endblock %}
