{% extends 'layout.html' %}
{% block content %}
<div class="page-grid">
  <div class="card chart-card">
    <h3>Model comparison</h3>
    <canvas id="compare-chart"></canvas>
  </div>
  <div class="card">
    <h3>Performance table</h3>
    <div class="table-scroll">
      <table id="compare-table">
        <thead><tr><th>Model</th><th>RMSE</th><th>MAE</th><th>MAPE</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <h3>Forecast quality</h3>
    <div id="comparison-insight">View model error rates and choose the best outcomes automatically.</div>
  </div>
</div>
{% endblock %}
