{% extends 'layout.html' %}
{% block content %}
<div class="forecast-grid">
  <div class="card">
    <h3>Predict future values</h3>
    <form id="predict-form">
      <label for="periods">Forecast horizon</label>
      <input id="periods" name="periods" type="number" min="1" max="365" value="30" placeholder="e.g. 30" />
      <p class="form-hint">Enter a positive number, then choose Days, Weeks, Months, or Years.</p>
      <label for="horizon">Horizon units</label>
      <select id="horizon" name="horizon">
        <option value="days">Days</option>
        <option value="months">Months</option>
        <option value="years">Years</option>
      </select>
      <button type="submit" class="button primary">Run prediction</button>
    </form>
  </div>
  <div class="card">
    <h3>Forecast engine</h3>
    <div id="forecast-summary">Prepare a forecast to display results.</div>
  </div>
  <div class="card chart-card">
    <h3>Future prediction trend</h3>
    <canvas id="forecast-chart"></canvas>
  </div>
  <div class="card">
    <h3>Prediction table</h3>
    <div class="table-scroll">
      <table id="forecast-table">
        <thead><tr><th>Date</th><th>Prediction</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
